<section data-screen-label="Galerie" style="position:relative;background:#050506;padding:clamp(130px,18vh,210px) clamp(18px,4vw,64px) clamp(60px,7vw,110px)">
  <div style="max-width:1500px;margin:0 auto">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:28px 48px">
      <div>
        <div style="display:flex;align-items:center;gap:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.26em;color:#9A9AA2;animation:hs-in .9s cubic-bezier(.16,1,.3,1) .1s both"><span style="display:block;width:28px;height:1px;background:#E10600"></span>GALERIE — DIE HALLE</div>
        <h1 style="margin:clamp(22px,3vw,40px) 0 0;font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;font-size:clamp(56px,10vw,170px);line-height:.86;text-transform:uppercase;color:#F2EFEA;animation:hs-rise 1s cubic-bezier(.16,1,.3,1) .2s both">Sehen, was dich <span style="color:#E10600">erwartet.</span></h1>
      </div>
      <p style="margin:0;max-width:40ch;font-size:clamp(15px,1.15vw,18px);line-height:1.7;color:#C4C4CA;text-wrap:pretty;animation:hs-in 1s cubic-bezier(.16,1,.3,1) .4s both">Sprintbahn, Racks, Plattformen, Spiegelwand, Umkleiden — und das rote Licht. Die Halle, wie sie ist.</p>
    </div>
  </div>
</section>

<section data-screen-label="Fotos" style="position:relative;background:#050506;padding:0 clamp(18px,4vw,64px) clamp(60px,8vw,120px)">
  <div data-gal style="max-width:1500px;margin:0 auto">
    <figure data-span="6" style="aspect-ratio:16/10"><img src="assets/gal-hall.jpg" alt="Die Halle: Sprintbahn, Racks und Spiegelwand"><figcaption>01 — Die Halle</figcaption></figure>
    <figure data-span="3" style="aspect-ratio:4/5"><img src="assets/gal-chalk.jpg" alt="Chalk auf der Lifting-Plattform"><figcaption>02 — Chalk</figcaption></figure>
    <figure data-span="3" style="aspect-ratio:4/5"><img src="assets/gal-led.jpg" alt="Rotes Lichtband über der Spiegelwand"><figcaption>03 — Lichtband</figcaption></figure>
    <figure data-span="4" style="aspect-ratio:4/3"><img src="assets/eq-racks.jpg" alt="Racks und Cages"><figcaption>04 — Racks &amp; Cages</figcaption></figure>
    <figure data-span="4" style="aspect-ratio:4/3"><img src="assets/eq-platform.jpg" alt="Lifting-Plattform"><figcaption>05 — Plattform</figcaption></figure>
    <figure data-span="4" style="aspect-ratio:4/3"><img src="assets/eq-plates.jpg" alt="Competition Plates"><figcaption>06 — Competition Plates</figcaption></figure>
    <figure data-span="6" style="aspect-ratio:16/10"><img src="assets/p-kraft.jpg" alt="Kraftbereich"><figcaption>07 — Kraft</figcaption></figure>
    <figure data-span="6" style="aspect-ratio:16/10"><img src="assets/p-functional.jpg" alt="Athletikfläche mit Sprintbahn"><figcaption>08 — Athletik</figcaption></figure>
    <figure data-span="4" style="aspect-ratio:4/3"><img src="assets/gal-cardio.jpg" alt="Laufband im Conditioning-Bereich"><figcaption>09 — Conditioning</figcaption></figure>
    <figure data-span="4" style="aspect-ratio:4/3"><img src="assets/g-kettle.jpg" alt="Kettlebells in einer Reihe"><figcaption>10 — Kettlebells</figcaption></figure>
    <figure data-span="4" style="aspect-ratio:4/3"><img src="assets/g-dumbbell.jpg" alt="Hantelscheiben am Rack, dahinter die Sprintbahn"><figcaption>11 — Scheiben</figcaption></figure>
    <figure data-span="6" style="aspect-ratio:16/10"><img src="assets/gal-locker.jpg" alt="Umkleide mit roten Lichtlinien"><figcaption>12 — Umkleide</figcaption></figure>
    <figure data-span="6" style="aspect-ratio:16/10"><img src="assets/gal-stack.jpg" alt="Scheibenstapel an der Maschine"><figcaption>13 — Scheibenstapel</figcaption></figure>
    <figure data-span="4" style="aspect-ratio:4/3"><img src="assets/eq-machines.jpg" alt="Spezialmaschinen"><figcaption>14 — Spezialmaschinen</figcaption></figure>
    <figure data-span="4" style="aspect-ratio:4/3"><img src="assets/eq-sled.jpg" alt="Sprintbahn mit Schlitten"><figcaption>15 — Sprintbahn</figcaption></figure>
    <figure data-span="4" style="aspect-ratio:4/3"><img src="assets/eq-treadmill.jpg" alt="Laufbänder"><figcaption>16 — Laufbänder</figcaption></figure>
  </div>
</section>

<section data-screen-label="Bewegtbild" style="position:relative;background:#050506;padding:0 clamp(18px,4vw,64px) clamp(90px,11vw,170px)">
  <div style="max-width:1500px;margin:0 auto;border-top:1px solid rgba(255,255,255,.12);padding-top:clamp(60px,8vw,120px)">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:28px 48px;margin-bottom:clamp(36px,4.6vw,64px)">
      <div>
        <div style="display:flex;align-items:center;gap:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.26em;color:#9A9AA2;animation:hs-in .9s cubic-bezier(.16,1,.3,1) both;animation-timeline:view();animation-range:entry 0% cover 18%"><span style="display:block;width:28px;height:1px;background:#E10600"></span>BEWEGTBILD</div>
        <h2 style="margin:clamp(22px,3vw,40px) 0 0;font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;font-size:clamp(52px,7.5vw,130px);line-height:.86;text-transform:uppercase;color:#F2EFEA;animation:hs-rise 1s cubic-bezier(.16,1,.3,1) both;animation-timeline:view();animation-range:entry 4% cover 32%">Die Halle in Bewegung<span style="color:#E10600">.</span></h2>
      </div>
      <p style="margin:0;max-width:40ch;font-size:clamp(15px,1.15vw,18px);line-height:1.7;color:#C4C4CA;text-wrap:pretty">Beim Hover läuft der Clip. Auf dem Telefon: einmal antippen.</p>
    </div>
    <div data-gal style="gap:1px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12)">
      <figure data-span="6" data-eq-card onPointerEnter="{{ eqEnter }}" onPointerLeave="{{ eqLeave }}" style="aspect-ratio:16/9;background:#050506"><img src="assets/p-mirror.jpg" alt="Spiegelwand"><video data-src="assets/v-mirror.mp4" muted="muted" loop="loop" playsinline="playsinline" preload="none" style="opacity:0;transition:opacity .6s ease"></video><figcaption><span style="display:inline-block;width:6px;height:6px;background:#E10600;margin-right:8px;vertical-align:middle"></span>REC — Spiegelwand</figcaption></figure>
      <figure data-span="6" data-eq-card onPointerEnter="{{ eqEnter }}" onPointerLeave="{{ eqLeave }}" style="aspect-ratio:16/9;background:#050506"><img src="assets/cine-descent-poster.jpg" alt="Abstieg in die Halle"><video data-src="assets/cine-descent.mp4" muted="muted" loop="loop" playsinline="playsinline" preload="none" style="opacity:0;transition:opacity .6s ease"></video><figcaption><span style="display:inline-block;width:6px;height:6px;background:#E10600;margin-right:8px;vertical-align:middle"></span>REC — Abstieg</figcaption></figure>
      <figure data-span="4" data-eq-card onPointerEnter="{{ eqEnter }}" onPointerLeave="{{ eqLeave }}" style="aspect-ratio:16/10;background:#050506"><img src="assets/g-dumbbell.jpg" alt="Hantelscheiben"><video data-src="assets/v-dumbbells.mp4" muted="muted" loop="loop" playsinline="playsinline" preload="none" style="opacity:0;transition:opacity .6s ease"></video><figcaption><span style="display:inline-block;width:6px;height:6px;background:#E10600;margin-right:8px;vertical-align:middle"></span>REC — Hanteln</figcaption></figure>
      <figure data-span="4" data-eq-card onPointerEnter="{{ eqEnter }}" onPointerLeave="{{ eqLeave }}" style="aspect-ratio:16/10;background:#050506"><img src="assets/g-kettle.jpg" alt="Kettlebells"><video data-src="assets/v-kettle.mp4" muted="muted" loop="loop" playsinline="playsinline" preload="none" style="opacity:0;transition:opacity .6s ease"></video><figcaption><span style="display:inline-block;width:6px;height:6px;background:#E10600;margin-right:8px;vertical-align:middle"></span>REC — Kettlebells</figcaption></figure>
      <figure data-span="4" data-eq-card onPointerEnter="{{ eqEnter }}" onPointerLeave="{{ eqLeave }}" style="aspect-ratio:16/10;background:#050506"><img src="assets/v-crane-poster.jpg" alt="Die Halle in der Weite"><video data-src="assets/v-crane.mp4" muted="muted" loop="loop" playsinline="playsinline" preload="none" style="opacity:0;transition:opacity .6s ease"></video><figcaption><span style="display:inline-block;width:6px;height:6px;background:#E10600;margin-right:8px;vertical-align:middle"></span>REC — Weite</figcaption></figure>
    </div>
  </div>
</section>
